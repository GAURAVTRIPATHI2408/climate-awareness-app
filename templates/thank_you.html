<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thank You - Climate Awareness Survey</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dff7e3,
                    #c7f0ff
                );

        }


        .box {

            background: white;

            padding: 45px 30px;

            border-radius: 22px;

            text-align: center;

            width: 90%;

            max-width: 500px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);

        }


        .icon {

            font-size: 65px;

            margin-bottom: 10px;

        }


        h1 {

            color: #198754;

            margin-bottom: 15px;

        }


        p {

            color: #555;

            font-size: 17px;

            line-height: 1.7;

        }


        .message {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #eef9f1;

            color: #27743d;

        }

    </style>

</head>


<body>


    <div class="box">

        <div class="icon">
            🌱
        </div>


        <h1>
            Thank You!
        </h1>


        <p>
            Thank you for completing the
            Climate Awareness Survey.
        </p>


        <div class="message">

            Your response has been
            successfully submitted.

        </div>


        <p>
            Your participation helps us
            understand climate awareness
            better.
        </p>

    </div>


</body>

</html>
