<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #e3f2fd
                );

        }


        .login-box {

            background: white;

            width: 90%;

            max-width: 380px;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);

            text-align: center;

        }


        .icon {

            font-size: 50px;

            margin-bottom: 10px;

        }


        h2 {

            color: #198754;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

            outline: none;

            margin-bottom: 15px;

        }


        input:focus {

            border-color: #198754;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #198754;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        .error {

            color: #dc3545;

            background: #fff0f0;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

        }

    </style>

</head>


<body>


    <div class="login-box">

        <div class="icon">
            🔐
        </div>


        <h2>
            Admin Login
        </h2>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">

                Login to Dashboard

            </button>

        </form>

    </div>


</body>

</html>
