<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Change Impacts Analysis Survey</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef8f0, #fff);
            color: #183b25;
        }

        nav {
            background: #146b3a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 12px;
        }

        main {
            width: 92%;
            max-width: 800px;
            margin: 35px auto;
        }

        h1 { color: #146b3a; text-align: center; }
        .intro { text-align: center; line-height: 1.6; }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 5px 20px #19573118;
            border: 1px solid #e1eee5;
        }

        label { display: block; font-weight: bold; margin-bottom: 9px; }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #b8cdbd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #35724c;
            font-weight: bold;
        }

        .progress {
            height: 9px;
            background: #dcebe0;
            border-radius: 10px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            width: 0;
            background: #249653;
            transition: width .2s;
        }

        #questionNumber {
            color: #249653;
            font-weight: bold;
        }

        #questionText {
            font-size: 23px;
            line-height: 1.4;
            margin: 18px 0 25px;
        }

        .options {
            display: flex;
            gap: 15px;
        }

        .option { flex: 1; }
        .option input { position: absolute; opacity: 0; }

        .option label {
            padding: 15px;
            text-align: center;
            border: 2px solid #d7e8dc;
            border-radius: 10px;
            cursor: pointer;
        }

        .option input:checked + label {
            background: #249653;
            color: white;
            border-color: #249653;
        }

        .option input:focus-visible + label {
            outline: 3px solid #183b25;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            padding: 13px 20px;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        #previousBtn { background: #edf3ef; color: #35724c; }
        #nextBtn, #submitBtn { background: #146b3a; color: white; }
        #submitBtn[hidden], #nextBtn[hidden] { display: none; }

        @media (max-width: 550px) {
            .card { padding: 20px; }
            #questionText { font-size: 20px; }
            .options { flex-direction: column; }
        }
    </style>
</head>

<body>
    <nav>
        <strong>🌍 Climate Awareness</strong>
        <div>
            <a href="/">Home</a>
            <a href="/admin-login">Admin</a>
        </div>
    </nav>

    <main>
        <h1>Climate Change Impacts Analysis</h1>
        <p class="intro">
            Please answer this survey to help us understand climate
            awareness and environmental impacts in your local community.
        </p>

        <form action="{{ url_for('submit_survey') }}"
              method="POST" id="surveyForm">

            <section class="card">
                <h2>Respondent Details</h2>

                <label for="respondent_name">What is your name?</label>
                <input type="text"
                       id="respondent_name"
                       name="respondent_name"
                       maxlength="100"
                       autocomplete="name"
                       placeholder="Enter your name"
                       required>

                <label for="respondent_age">What is your age?</label>
                <input type="number"
                       id="respondent_age"
                       name="respondent_age"
                       min="1"
                       max="120"
                       step="1"
                       placeholder="Enter your age"
                       required>
            </section>

            <section class="card">
                <div class="progress-info">
                    <span id="progressText">Question 1 of 20</span>
                    <span id="percentage">5%</span>
                </div>
                <div class="progress">
                    <div id="progressFill"></div>
                </div>

                <div id="questionNumber">Question 01</div>
                <div id="questionText"></div>
                <div class="options" id="optionsContainer"></div>

                <div class="navigation">
                    <button type="button" id="previousBtn" hidden>
                        ← Previous
                    </button>
                    <button type="button" id="nextBtn">
                        Next →
                    </button>
                    <button type="submit" id="submitBtn" hidden>
                        Submit Survey ✓
                    </button>
                </div>
            </section>
        </form>
    </main>

    <script>
        const questions = [
            "Are you aware of climate change?",
            "Do you think climate change is affecting your local area?",
            "Have you noticed changes in temperature in recent years?",
            "Have you noticed changes in rainfall patterns?",
            "Does waterlogging or flooding occur in your area?",
            "Do you separate wet and dry waste at home?",
            "Do you try to reduce the use of plastic bags?",
            "Are you aware of rainwater harvesting?",
            "Do you avoid unnecessary water wastage?",
            "Do you try to save electricity at home?",
            "Do you switch off lights and fans when they are not needed?",
            "Do you use public transport or carpooling to reduce pollution?",
            "Does your local area have enough trees and green spaces?",
            "Have you ever participated in a tree plantation activity?",
            "Do you think plastic pollution contributes to environmental problems?",
            "Do you think burning waste is harmful to the environment?",
            "Would you participate in future climate awareness programs?",
            "Do you share climate awareness information with your family or friends?",
            "Are you willing to change your daily habits to help reduce climate change?",
            "Do you think the local community can work together to reduce climate change impacts?"
        ];

        const answers = Array(questions.length).fill("");
        let currentQuestion = 0;

        const form = document.getElementById("surveyForm");
        const questionText = document.getElementById("questionText");
        const questionNumber = document.getElementById("questionNumber");
        const optionsContainer = document.getElementById("optionsContainer");
        const progressText = document.getElementById("progressText");
        const percentage = document.getElementById("percentage");
        const progressFill = document.getElementById("progressFill");
        const previousBtn = document.getElementById("previousBtn");
        const nextBtn = document.getElementById("nextBtn");
        const submitBtn = document.getElementById("submitBtn");

        function renderQuestion() {
            const number = currentQuestion + 1;

            questionNumber.textContent =
                `Question ${String(number).padStart(2, "0")}`;
            questionText.textContent = questions[currentQuestion];

            const progress = Math.round(number / questions.length * 100);
            progressText.textContent =
                `Question ${number} of ${questions.length}`;
            percentage.textContent = `${progress}%`;
            progressFill.style.width = `${progress}%`;

            optionsContainer.replaceChildren();

            ["Yes", "No"].forEach(answer => {
                const wrapper = document.createElement("div");
                wrapper.className = "option";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = `q${number}`;
                radio.id = `q${number}_${answer.toLowerCase()}`;
                radio.value = answer;
                radio.checked = answers[currentQuestion] === answer;

                radio.addEventListener("change", () => {
                    answers[currentQuestion] = answer;
                });

                const label = document.createElement("label");
                label.htmlFor = radio.id;
                label.textContent = answer === "Yes" ? "✓ Yes" : "✕ No";

                wrapper.append(radio, label);
                optionsContainer.appendChild(wrapper);
            });

            previousBtn.hidden = currentQuestion === 0;
            nextBtn.hidden = currentQuestion === questions.length - 1;
            submitBtn.hidden = currentQuestion !== questions.length - 1;
        }

        nextBtn.addEventListener("click", () => {
            if (!answers[currentQuestion]) {
                alert("Please select Yes or No before continuing.");
                return;
            }

            currentQuestion++;
            renderQuestion();
        });

        previousBtn.addEventListener("click", () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        });

        form.addEventListener("submit", event => {
            if (!answers.every(answer => answer === "Yes" || answer === "No")) {
                event.preventDefault();
                const missingIndex = answers.findIndex(
                    answer => answer !== "Yes" && answer !== "No"
                );

                if (missingIndex !== -1) {
                    currentQuestion = missingIndex;
                    renderQuestion();
                    alert(`Please answer question ${missingIndex + 1}.`);
                }
                return;
            }

            // Create one hidden input for every saved answer.
            for (let i = 0; i < answers.length; i++) {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = `q${i + 1}`;
                input.value = answers[i];
                form.appendChild(input);
            }
        });

        renderQuestion();
    </script>
</body>
</html>
